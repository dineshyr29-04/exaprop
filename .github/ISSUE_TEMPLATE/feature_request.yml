name: Feature request
description: Propose an ExaProp improvement with a concrete use case
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Distinguish current functionality from roadmap proposals.
        Use synthetic examples and omit private infrastructure details or credentials.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What task is difficult with the current implementation?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired outcome and a concrete CLI, API, or workflow example if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative approaches
      description: Existing features, workarounds, other tools, or doing nothing.
  - type: textarea
    id: compatibility
    attributes:
      label: Scope and compatibility
      description: Consider HTTP semantics, observation privacy, resource bounds, platforms, and existing users. State uncertainties.
  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to contribute?
      options:
        - Not sure yet
        - I can help implement this
        - I can help test or document this
        - I am sharing a use case only
