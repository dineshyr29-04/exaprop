name: ✨ Feature Request
description: Propose a new feature, capability, or resilience simulation module
labels: ["enhancement", "discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea to make FaultLab better!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Use Case
      description: Is your feature request related to a specific challenge or limitation?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Design
      description: Describe the solution or new feature you would like to see.
      placeholder: Detailed description of proposed API, CLI flag, or architecture...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Considered Alternatives
      description: Any alternative solutions, patterns, or workarounds you've explored.
  - type: dropdown
    id: area
    attributes:
      label: Component / Area
      options:
        - Core Engine / State Modeling
        - Chaos / Fault Injection
        - Incident Investigation / Timeline
        - CLI & Tooling
        - Documentation & Examples
        - Other
    validations:
      required: true
