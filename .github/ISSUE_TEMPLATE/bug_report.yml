name: 🐛 Bug Report
description: Report a reproducible bug or unexpected error in FaultLab
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Please provide as much detail as possible to help us reproduce and resolve the problem quickly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem clearly...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue.
      placeholder: |
        1. Run '...'
        2. Execute scenario '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Logs or Output
      description: Relevant logs or terminal tracebacks (use code blocks).
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment & System Info
      description: OS version, compiler/runtime, FaultLab version, architecture.
      placeholder: |
        - OS: Linux (Fedora 44 / Ubuntu 24.04 / macOS 15)
        - Architecture: x86_64 / arm64
        - Version: v0.1.0
    validations:
      required: true
